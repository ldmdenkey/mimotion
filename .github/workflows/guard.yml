name: 调度看护

# 背景：GitHub 对定时任务（schedule）存在静默降权/延迟投递，run.yml 的 cron 常在深夜甚至次日才真正执行。
# 本工作流不复用 run.yml 的 cron，而是自己每隔几小时巡检一次：
#   发现「今天这个时段」还没有成功跑过，就地补跑一次。
# 好处：不依赖本地电脑开机联网，也不需要额外的 PAT。
on:
  schedule:
    # 北京时间 09:23 / 12:23 / 15:23 / 18:23 / 20:23 / 22:23 / 23:23
    - cron: '23 1,4,7,10,12,14,15 * * *'
  workflow_dispatch:

# 与 run.yml 共用同一个并发组：两个工作流不会同时执行，避免 token 文件回写冲突
concurrency:
  group: mimotion-sync
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 判断今天是否还需要补跑
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEED=$(python3 - <<'PY'
          import os, sys, json, datetime, urllib.request

          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz)
          day = now.strftime("%Y-%m-%d")
          hour = now.hour

          url = "https://api.github.com/repos/%s/actions/runs?per_page=60" % os.environ["GITHUB_REPOSITORY"]
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "mimotion-guard",
          })
          try:
              data = json.load(urllib.request.urlopen(req, timeout=30))
          except Exception as e:
              print("查询运行记录失败: %s" % e, file=sys.stderr)
              print(0)
              raise SystemExit

          morning = evening = pending = 0
          for r in data.get("workflow_runs", []):
              if "run.yml" not in (r.get("path") or ""):
                  continue
              if r.get("status") in ("queued", "in_progress", "requested", "waiting", "pending"):
                  pending = 1
              if r.get("conclusion") != "success":
                  continue
              try:
                  dt = datetime.datetime.strptime(r["created_at"], "%Y-%m-%dT%H:%M:%SZ") \
                      .replace(tzinfo=datetime.timezone.utc).astimezone(tz)
              except Exception:
                  continue
              if dt.strftime("%Y-%m-%d") != day:
                  continue
              if dt.hour >= 18:
                  evening = 1
              else:
                  morning = 1

          need = 0
          if hour >= 9 and not pending:
              if hour >= 18:
                  need = 0 if evening else 1
              else:
                  need = 0 if morning else 1

          print("北京时间 %s 时 | 上午段成功=%d 晚上段成功=%d 排队中=%d -> need=%d"
                % (hour, morning, evening, pending, need), file=sys.stderr)
          print(need)
          PY
          )
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: 补跑刷步数
        if: steps.gate.outputs.need == '1'
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          TZ: Asia/Shanghai
        run: |
          echo "本时段尚未成功执行，开始补跑"
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: 持久化 Token
        if: steps.gate.outputs.need == '1'
        run: |
          git config --local user.name github-actions
          git config --local user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "update token" || exit 0
          git push origin master
